[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-engine"
version = "0.1.0"
description = "Adaptive Enterprise RAG with permission-aware governance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishav Chatterjee" }]
dependencies = [
    "pydantic>=2.6",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
qdrant = ["qdrant-client>=1.9"]
rerank = ["sentence-transformers>=3.0"]
turbovec = ["turbovec==0.7.0"]            # P0.2b vector index (pinned)
surrealdb = ["surrealdb>=2.0"]            # P0.2a unified store SDK
sql = ["sqlglot>=25"]                     # P0.3a read-only AST gate + transpile
bigquery = ["sqlglot>=25", "google-cloud-bigquery>=3.20"]  # P0.3a live path
semantic = ["semantic-router>=0.1"]       # P0.3b adaptive router (local encoder)
llm = ["openai>=1.40"]                     # P0.3b Groq/NVIDIA OpenAI-compatible
observability = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]  # P0.5 OTel
langfuse = ["langfuse>=2.0"]               # P0.5 trace export (live)
# dev installs everything the test suite needs to RUN (no skip-by-missing-dep).
# (sqlglot is required for the SQL-safety tests; google-cloud-bigquery is the
# live-path-only dep and stays out of dev — that path is creds-gated/skipped.)
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27",
    "turbovec==0.7.0", "surrealdb>=2.0", "faker>=40", "polars>=1.0", "sqlglot>=25",
    "semantic-router>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cloud: tests that hit SurrealDB Cloud (creds-gated; run with -m cloud). CI runs -m 'not cloud'.",
    "bq: tests that hit live BigQuery (creds-gated; run with -m bq). CI runs -m 'not bq'.",
    "llm: tests that hit a live Groq/NVIDIA LLM (creds-gated; run with -m llm). CI runs -m 'not llm'.",
    "langfuse: tests that hit live Langfuse (creds-gated; run with -m langfuse). CI runs -m 'not langfuse'.",
    "spicedb: tests that hit a live self-hosted SpiceDB (binary/creds-gated; run with -m spicedb). CI runs -m 'not spicedb'.",
    "oso: tests that hit live Oso Cloud (creds-gated; run with -m oso). CI runs -m 'not oso'.",
]
filterwarnings = [
    # semantic-router 0.1.2 uses deprecated pydantic v1 .dict()/.json() internally;
    # not our code, and not actionable here.
    "ignore::DeprecationWarning:semantic_router",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 100
target-version = "py311"
