name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit + adversarial tests
        run: pytest -v
      - name: Governance + retrieval quality gate
        # Fails the build on any restricted-data leak or recall regression.
        run: python scripts/demo_leakage.py
